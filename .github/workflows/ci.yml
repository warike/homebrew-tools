name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Casks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Lint casks
        run: |
          for cask in Casks/*.rb; do
            echo "Linting $cask..."
            brew audit --cask "$cask" || true
            brew style --fix "$cask" || true
          done

  verify:
    name: Verify Downloads
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SHA256 checksums
        run: |
          for cask in Casks/*.rb; do
            echo "Checking $cask..."
            url=$(grep -E '^\s*url "' "$cask" | sed 's/.*url "//;s/".*//' | head -1)
            sha=$(grep -E '^\s*sha256 "' "$cask" | sed 's/.*sha256 "//;s/".*//')
            version=$(grep -E '^\s*version "' "$cask" | sed 's/.*version "//;s/".*//')

            # Substitute version in URL
            url=$(echo "$url" | sed "s/#{version}/$version/g")

            echo "  URL: $url"
            echo "  Expected SHA: $sha"

            # Download and verify
            actual_sha=$(curl -sL "$url" | shasum -a 256 | cut -d' ' -f1)
            echo "  Actual SHA: $actual_sha"

            if [ "$sha" = "$actual_sha" ]; then
              echo "  ✅ SHA256 matches"
            else
              echo "  ❌ SHA256 mismatch!"
              exit 1
            fi
          done
